<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ashwin's phone</title>
<style>
  :root { --bg: #ffffff; --fg: #111111; --muted: #8e8e93; --line: #e5e5ea; --me: #34c759; --them: #e9e9eb; --themfg: #111; --bar: #f9f9f9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #f2f2f7; --muted: #8e8e93; --line: #2c2c2e; --me: #30d158; --them: #26252a; --themfg: #f2f2f7; --bar: #1c1c1e; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.35 -apple-system, system-ui, sans-serif; display: flex; justify-content: center; }
  .phone { width: 100%; max-width: 430px; height: 100%; display: flex; flex-direction: column; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  header { padding: 12px 16px; background: var(--bar); border-bottom: 1px solid var(--line); text-align: center; }
  header b { display: block; font-size: 15px; }
  header span { font-size: 12px; color: var(--muted); }
  #thread { flex: 1; overflow-y: auto; padding: 12px 12px 4px; display: flex; flex-direction: column; gap: 4px; }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .out { align-self: flex-end; background: var(--me); color: #fff; border-bottom-right-radius: 4px; }
  .in { align-self: flex-start; background: var(--them); color: var(--themfg); border-bottom-left-radius: 4px; }
  .msg img { display: block; max-width: 100%; border-radius: 12px; margin: 2px 0; }
  .time { font-size: 11px; color: var(--muted); text-align: center; margin: 8px 0 2px; }
  .status { font-size: 11px; color: var(--muted); align-self: flex-end; margin-right: 4px; }
  form { display: flex; gap: 8px; align-items: center; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bar); }
  #text { flex: 1; min-width: 0; font: inherit; padding: 8px 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .icon { border: 0; background: none; color: var(--me); font-size: 24px; width: 34px; height: 34px; cursor: pointer; }
  #send { background: var(--me); color: #fff; border-radius: 50%; font-size: 18px; }
  #preview { display: none; padding: 6px 12px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  #pair { padding: 24px 16px; display: none; gap: 8px; }
  #pair input { flex: 1; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); }
  #pair button { font: inherit; padding: 10px 14px; border-radius: 10px; border: 0; background: var(--me); color: #fff; }
</style>
</head>
<body>
<div class="phone">
  <header><b>Lana</b><span id="sub">+1 314-464-9040 · text message</span></header>
  <div id="pair"><input id="code" inputmode="numeric" placeholder="Relay pairing code"><button id="pairBtn">Pair</button></div>
  <div id="thread"></div>
  <div id="preview"></div>
  <form id="form">
    <button type="button" class="icon" id="attach" title="Add photo">＋</button>
    <input type="file" id="file" accept="image/*" hidden>
    <input id="text" autocomplete="off" placeholder="Text Message">
    <button class="icon" id="send" title="Send">↑</button>
  </form>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  let token = store.get('lana_device_token');
  let photo = null;
  let lastRender = '';

  const api = (path, opts = {}) => fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '1', ...(token ? { Authorization: `Bearer ${token}` } : {}) } })
    .then(async (r) => { const b = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(b.error?.user_message || `HTTP ${r.status}`), { status: r.status }); return b; });
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  function showPair(on) { $('pair').style.display = on ? 'flex' : 'none'; $('form').style.display = on ? 'none' : 'flex'; }

  async function refresh() {
    if (!token) return;
    try {
      const { messages, sim_phone } = await api('/sim/thread');
      $('sub').textContent = `+1 314-464-9040 · from ${sim_phone}`;
      let html = '', lastMinute = '';
      for (const m of messages) {
        const minute = clock(m.created_at);
        if (minute !== lastMinute) { html += `<div class="time">${minute}</div>`; lastMinute = minute; }
        const imgs = (m.media || []).filter((x) => (x.content_type || '').startsWith('image/')).map((x) => `<img src="${esc(x.url)}" alt="">`).join('');
        html += `<div class="msg ${m.direction}">${imgs}${m.body ? esc(m.body) : ''}</div>`;
      }
      if (html !== lastRender) {
        const atBottom = $('thread').scrollHeight - $('thread').scrollTop - $('thread').clientHeight < 80;
        $('thread').innerHTML = html; lastRender = html;
        if (atBottom || !lastRender) $('thread').scrollTop = $('thread').scrollHeight;
      }
    } catch (e) { if (e.status === 401) { token = null; showPair(true); } }
  }

  $('pairBtn').onclick = async () => {
    try {
      const r = await api('/v1/pair', { method: 'POST', body: JSON.stringify({ code: $('code').value.trim() }) });
      token = r.device_token; store.set('lana_device_token', token); showPair(false); refresh();
    } catch (e) { alert(e.message); }
  };
  $('attach').onclick = () => $('file').click();
  $('file').onchange = () => {
    const f = $('file').files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => { photo = { base64: reader.result.split(',')[1], content_type: f.type || 'image/jpeg', filename: f.name }; $('preview').style.display = 'block'; $('preview').textContent = `Photo attached: ${f.name}`; };
    reader.readAsDataURL(f);
  };
  $('form').onsubmit = async (ev) => {
    ev.preventDefault();
    const text = $('text').value.trim();
    if (!text && !photo) return;
    $('send').disabled = true;
    try {
      await api('/sim/send', { method: 'POST', body: JSON.stringify({ text, image: photo }) });
      $('text').value = ''; photo = null; $('file').value = ''; $('preview').style.display = 'none';
      refresh();
    } catch (e) { $('preview').style.display = 'block'; $('preview').textContent = `Not sent: ${e.message}`; }
    $('send').disabled = false;
  };

  showPair(!token);
  refresh();
  setInterval(refresh, 1500);
</script>
</body>
</html>

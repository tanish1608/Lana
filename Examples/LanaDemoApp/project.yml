# Matches the checked-in LanaDemoApp.xcodeproj; `xcodegen generate` here regenerates it.
name: LanaDemoApp
options:
  bundleIdPrefix: io.speedhacks
  deploymentTarget:
    iOS: "26.0"
packages:
  FWMFeatureUI:
    path: ../../Packages/FWMFeatureUI
targets:
  LanaDemoApp:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes: ["project.yml", "LanaDemoApp.xcodeproj"]
      - path: ../../fixtures/seed-v1.json
        buildPhase: resources
    dependencies:
      - package: FWMFeatureUI
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lana
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record a message for on-device transcription.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Transcribe your voice on this device.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock credentials and authorize reviewed actions.
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: io.speedhacks.LanaDemoApp
    scheme:
      testTargets: []
